name: Evals (pull request, Node.js)

on:
  pull_request:
    paths: ["node/**", "evals/datasets/**", "data/**"]

permissions:
  contents: read

defaults:
  run:
    working-directory: node

jobs:
  offline-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: node/package-lock.json }
      - run: npm ci
      - run: npm test

  evals-node:
    needs: offline-node
    runs-on: ubuntu-latest
    # Advisory until the suite is stable: a failed eval shows on the PR but doesn't
    # block the merge. Set the repository variable EVALS_BLOCKING to "true" to gate.
    continue-on-error: ${{ vars.EVALS_BLOCKING != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: node/package-lock.json }
      - run: npm ci
      - name: Run the PR eval set
        env:
          LD_SDK_KEY: ${{ secrets.LD_SDK_KEY }}
          LD_API_TOKEN: ${{ secrets.LD_API_TOKEN }}
          LD_PROJECT_KEY: ${{ vars.LD_PROJECT_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run evals -- --dataset ../evals/datasets/pr.jsonl --blocking
