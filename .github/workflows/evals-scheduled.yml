name: Evals (scheduled)

on:
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run the full eval set
        env:
          LD_SDK_KEY: ${{ secrets.LD_SDK_KEY }}
          LD_API_TOKEN: ${{ secrets.LD_API_TOKEN }}
          LD_PROJECT_KEY: ${{ vars.LD_PROJECT_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m evals.run_evals --dataset evals/datasets/full.jsonl --blocking
